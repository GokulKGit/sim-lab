<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>WebSocket · how it works</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* sim-lab styles. One topic page = header + tabs (Overview, Tour, Simulate, Check).
   Tour and Simulate put a diagram stage on the left and a control panel on the right.
   Node colours for topic files: var(--c-blue|green|orange|purple|teal|pink|amber|gray). */
:root{
  --bg:#ECF0F4; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#14202F; --muted:#56657A; --line:#D3DBE5; --grid:#DCE3EC;
  --accent:#1B5FD9; --accent-ink:#FFFFFF; --accent-soft:#E2EBFC;
  --ok:#137A3A; --ok-soft:#DFF2E6; --warn:#9A5800; --warn-soft:#FBEED7; --bad:#BF2F28; --bad-soft:#FBE3E1; --evt:#7238BE; --evt-soft:#EEE5FA;
  --code-bg:#0F1726; --code-ink:#D8E2F0; --code-muted:#7D8DA6; --code-ok:#7FD69B; --code-bad:#FF8A80; --code-acc:#8DB4FF; --code-warn:#F5C26B;
  --c-blue:#1A6FE0; --c-green:#188038; --c-orange:#C8530A; --c-purple:#8430A8; --c-teal:#0A8282; --c-pink:#BC1F5C; --c-amber:#A87C00; --c-gray:#5F6B7A;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif; --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,32,47,.06),0 4px 14px rgba(20,32,47,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131D; --surface:#151D2A; --surface-2:#1B2535; --ink:#E4EAF3; --muted:#9AA8BC; --line:#2A3649; --grid:#1C2635;
  --accent:#7EA8FF; --accent-ink:#0D131D; --accent-soft:#1D2C4A;
  --ok:#6FD394; --ok-soft:#163324; --warn:#F2B65C; --warn-soft:#3A2C14; --bad:#FF8B82; --bad-soft:#3D1D1C; --evt:#C3A0FF; --evt-soft:#2C2142;
  --code-bg:#080D16;
  --c-blue:#6FA6FF; --c-green:#4CC27A; --c-orange:#F08A4B; --c-purple:#C17BE3; --c-teal:#3CC2C2; --c-pink:#F06496; --c-amber:#E3B93C; --c-gray:#A2ADBB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131D; --surface:#151D2A; --surface-2:#1B2535; --ink:#E4EAF3; --muted:#9AA8BC; --line:#2A3649; --grid:#1C2635;
  --accent:#7EA8FF; --accent-ink:#0D131D; --accent-soft:#1D2C4A;
  --ok:#6FD394; --ok-soft:#163324; --warn:#F2B65C; --warn-soft:#3A2C14; --bad:#FF8B82; --bad-soft:#3D1D1C; --evt:#C3A0FF; --evt-soft:#2C2142;
  --code-bg:#080D16;
  --c-blue:#6FA6FF; --c-green:#4CC27A; --c-orange:#F08A4B; --c-purple:#C17BE3; --c-teal:#3CC2C2; --c-pink:#F06496; --c-amber:#E3B93C; --c-gray:#A2ADBB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
code,kbd{font-family:var(--mono);font-size:.86em}
p code,li code,td code,span code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-size:1.15rem;letter-spacing:-.01em}
.brand small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.top .spacer{flex:1}
.top-prog{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.bar{width:110px;height:6px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

main{padding-block:22px 60px}

/* Hex glyph (service icon) */
.hex{--c:var(--accent);width:46px;height:50px;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.02em;
  background:var(--c);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex.sm{width:34px;height:37px;font-size:.64rem}
.hex.lg{width:64px;height:70px;font-size:1rem}
.hex.ghost{background:transparent;color:var(--muted);box-shadow:none;position:relative}
.hex.ghost::before{content:"";position:absolute;inset:0;background:var(--line);clip-path:inherit}
.hex.ghost::after{content:"";position:absolute;inset:2px;background:var(--surface);clip-path:inherit}
.hex.ghost span{position:relative;z-index:1}
[data-theme="dark"] .hex:not(.ghost){color:#0D131D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hex:not(.ghost){color:#0D131D}}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.evt{background:var(--evt-soft);color:var(--evt);border-color:transparent}

/* Topic header */
.svc-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.svc-head .t{min-width:0;flex:1}
.svc-head h1{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.02em}
.svc-head p{color:var(--muted);margin-top:4px;max-width:70ch}
.svc-head .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;font-size:.9rem;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button .ok{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tabs button .ok.d{background:var(--ok)}

/* Panels and cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:1rem;margin-bottom:8px}
.lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ov-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.ov-hero .what{font-size:1.06rem}
.ov-hero .analogy{margin-top:10px;color:var(--muted);font-size:.92rem;border-left:3px solid var(--line);padding-left:10px}
ul.tick{list-style:none;padding:0;margin:0;display:grid;gap:7px}
ul.tick li{position:relative;padding-left:22px;font-size:.92rem}
ul.tick li::before{content:"";position:absolute;left:2px;top:.5em;width:10px;height:10px;border-radius:3px;background:var(--ok)}
ul.tick.no li::before{background:var(--bad);border-radius:50%}
ul.tick.sig li::before{background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%);border-radius:0}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.term{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface-2);font-size:.86rem;min-width:0}
.term b{display:block;font-family:var(--display);font-size:.92rem}
.term span{color:var(--muted);overflow-wrap:anywhere}
table.kv{width:100%;border-collapse:collapse;font-size:.88rem}
table.kv td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--muted);width:44%}
table.kv td:last-child{font-weight:600}
.tbl-wrap{overflow-x:auto}
.conn{display:grid;gap:8px}
.conn div{display:flex;gap:10px;align-items:center;font-size:.88rem;min-width:0}
.conn .arrow{color:var(--muted);font-family:var(--mono)}
.conn .how-txt{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.note-src{font-size:.78rem;color:var(--muted);margin-top:14px}

/* Stage (Tour + Simulate) */
.stage-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.stage-top{display:flex;gap:8px;flex-wrap:wrap;padding:12px 12px 0}
.metric{border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:88px;background:var(--surface-2)}
.metric .lbl{font-size:.62rem}
.metric b{display:block;font-family:var(--mono);font-size:.98rem;font-variant-numeric:tabular-nums}
.metric.ok b{color:var(--ok)}.metric.warn b{color:var(--warn)}.metric.bad b{color:var(--bad)}.metric.acc b{color:var(--accent)}
.scene-box{overflow-x:auto;padding:4px 6px}
.scene-svg{display:block;width:100%;min-width:600px;height:auto;font-family:var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 14px 12px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.side{display:grid;gap:12px;min-width:0}
.side .card{padding:14px}
.step-k{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.step-title{font-size:1.2rem;margin-bottom:8px}
.step-body{font-size:.92rem;display:grid;gap:8px}
.step-body p,.step-body li{overflow-wrap:anywhere}
.step-body ul{margin:0;padding-left:18px}
.tip{background:var(--ok-soft);border-radius:10px;padding:10px 12px;font-size:.86rem;margin-top:10px}
.tip.trap{background:var(--warn-soft)}
.tip .lbl{display:block;margin-bottom:2px;color:inherit;opacity:.8}
.nav-row{display:flex;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:.86rem;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.btn.sm{padding:5px 9px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.keys{font-size:.72rem;color:var(--muted);margin-top:8px}
.keys kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--surface-2)}
.steps-strip{display:flex;gap:6px;padding:12px 14px;border-top:1px solid var(--line);overflow-x:auto;align-items:center}
.steps-strip button{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:.78rem;cursor:pointer;color:var(--muted)}
.steps-strip button.seen{border-color:var(--ok);color:var(--ok)}
.steps-strip button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps-strip .now{font-size:.8rem;color:var(--muted);margin-left:6px;white-space:nowrap}

/* Simulate */
.sim-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sim-bar .clock{font-family:var(--mono);font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ctl{display:grid;gap:4px;padding:9px 0;border-bottom:1px solid var(--line)}
.ctl:last-child{border-bottom:0}
.ctl label,.ctl .cl{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:600}
.ctl output{font-family:var(--mono);color:var(--accent);font-size:.84rem}
.ctl small{color:var(--muted);font-size:.76rem;line-height:1.4}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl select{font:inherit;font-size:.85rem;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch input{accent-color:var(--accent);width:16px;height:16px}
.ctl-actions{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px}
.scen{display:grid;gap:6px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:.84rem}
.scen button b{display:block;font-size:.88rem}
.scen button span{color:var(--muted)}
.scen button:hover{border-color:var(--accent)}
.log{max-height:170px;overflow:auto;padding:8px 14px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:.76rem;display:grid;gap:3px;align-content:start}
.log div{display:flex;gap:8px;min-width:0}
.log time{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.log span{overflow-wrap:anywhere;min-width:0}
.log .ok{color:var(--ok)}.log .warn{color:var(--warn)}.log .bad{color:var(--bad)}.log .acc{color:var(--accent)}.log .evt{color:var(--evt)}
.explain{font-size:.86rem;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2);display:flex;gap:10px;align-items:flex-start}
.explain b{flex:none}

/* Terminal */
.term-box{background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);font-family:var(--mono);font-size:.78rem;overflow:hidden;border:1px solid var(--line)}
.term-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08);color:var(--code-muted);font-size:.72rem}
.term-head i{width:9px;height:9px;border-radius:50%;background:#3A4559;display:inline-block}
.term-out{height:230px;overflow:auto;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.term-out .p{color:var(--code-acc)}.term-out .ok{color:var(--code-ok)}.term-out .bad{color:var(--code-bad)}.term-out .mut{color:var(--code-muted)}.term-out .warn{color:var(--code-warn)}
.term-in{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid rgba(255,255,255,.08)}
.term-in span{color:var(--code-acc);flex:none}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:var(--code-ink);font:inherit;outline:none}
.cook{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cook button{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:3px 7px;cursor:pointer;color:var(--ink);text-align:left;max-width:100%;overflow-wrap:anywhere}
.cook button:hover{border-color:var(--accent)}

/* Check */
.quiz{display:grid;gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.q p{font-weight:600;margin-bottom:10px;overflow-wrap:anywhere}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;background:var(--surface-2);text-align:left;font-size:.9rem;width:100%}
.opt b{font-family:var(--mono);color:var(--muted);flex:none}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:8px;font-size:.86rem;color:var(--muted)}
.score{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.score b{font-family:var(--display);font-size:1.6rem}
.learn{display:grid;gap:6px}
.learn label{display:flex;gap:9px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.learn input{accent-color:var(--ok);margin-top:4px;flex:none}
.check-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

footer.foot{font-size:.8rem;color:var(--muted);padding-top:24px;border-top:1px solid var(--line);margin-top:30px;display:grid;gap:14px}
.foot-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.sources ol{margin:6px 0 0;padding-left:20px;display:grid;gap:3px}
.sources li{overflow-wrap:anywhere}
.theme-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 11px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--ink)}
.theme-btn:hover{border-color:var(--accent)}

/* SVG scene */
.scene-svg .grid-line{stroke:var(--grid);stroke-width:1}
.scene-svg .bgrect{fill:var(--surface)}
.scene-svg .grp rect{fill:var(--surface-2);stroke:var(--line);stroke-dasharray:5 4;stroke-width:1.2}
.scene-svg .grp text{fill:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.scene-svg .grp.acc rect{stroke:var(--accent)}
.scene-svg .grp.bad rect{stroke:var(--bad);fill:var(--bad-soft)}
.scene-svg .lk{stroke:var(--line);stroke-width:2;fill:none}
.scene-svg .lk.dash{stroke-dasharray:6 5}
.scene-svg .lk.acc{stroke:var(--accent);opacity:.55}
.scene-svg .lk.bad{stroke:var(--bad);opacity:.7}
.scene-svg .lk.evt{stroke:var(--evt);opacity:.6}
.scene-svg .lk-l{fill:var(--muted);font-size:10.5px;font-family:var(--mono)}
.scene-svg .lk-lb{fill:var(--surface)}
.scene-svg .nd{transition:transform .55s cubic-bezier(.3,.7,.3,1),opacity .35s}
.scene-svg .nd .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.scene-svg .nd .ttl{fill:var(--ink);font-size:14px;font-weight:600}
.scene-svg .nd .sub{fill:var(--muted);font-size:11.5px}
.scene-svg .nd .hx{fill:var(--nc,var(--accent))}
.scene-svg .nd .hxt{fill:var(--surface);font-size:9px;font-weight:700;font-family:var(--display)}
.scene-svg .nd .stripe{fill:var(--line)}
.scene-svg .nd.unit .ttl{font-size:12px}
.scene-svg .nd.unit .sub{font-size:10.5px}
.scene-svg .nd.hl .box{stroke:var(--accent);stroke-width:2.5}
.scene-svg .nd.dim{opacity:.35}
.scene-svg .nd.s-cold .box{stroke-dasharray:4 3}
.scene-svg .nd.s-cold .stripe{fill:var(--line)}
.scene-svg .nd.s-start .stripe{fill:var(--warn)}
.scene-svg .nd.s-start .box{stroke:var(--warn)}
.scene-svg .nd.s-ready .stripe{fill:var(--ok)}
.scene-svg .nd.s-busy .stripe{fill:var(--accent)}
.scene-svg .nd.s-busy .box{stroke:var(--accent)}
.scene-svg .nd.s-down .stripe{fill:var(--bad)}
.scene-svg .nd.s-down .box{stroke:var(--bad);fill:var(--bad-soft)}
.scene-svg .nd.s-idle .stripe{fill:var(--muted)}
.scene-svg .nd.s-evt .stripe{fill:var(--evt)}
.scene-svg .nd.s-evt .box{stroke:var(--evt)}
.scene-svg .nd.t-b .stripe{fill:var(--evt)}
.scene-svg .nd .bdg{fill:var(--accent)}

<script>
/* sim-lab: core registry and helpers. Topic files call SimLab.topic({...}). */
(function () {
  'use strict';
  const L = (window.SimLab = window.SimLab || {});

  /* One topic per page. */
  L.current = null;
  L.topic = function (t) {
    if (!t || !t.id || !t.name) throw new Error('SimLab.topic needs at least id and name');
    L.current = t;
  };
  /* Older lab files used addService; treat it the same. */
  L.services = {};
  L.addService = function (s) { L.services[s.id] = s; if (!L.current) L.topic(s); };

  /* Storage: wrapped, because it can be missing or throw. Keys are per topic. */
  const pre = () => 'simlab_' + (L.current ? L.current.id : 'x') + '_';
  L.store = {
    get(k, d) { try { const v = localStorage.getItem(pre() + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(pre() + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };

  /* Progress: one flag per tab. */
  L.prog = id => L.store.get('p_' + id, {});
  L.mark = (id, phase, val) => {
    const v = val === undefined ? true : val;
    const p = L.prog(id);
    if (p[phase] === v) return;
    p[phase] = v;
    L.store.set('p_' + id, p);
    document.dispatchEvent(new CustomEvent('simlab:progress'));
  };

  /* DOM helper: h('div', {class:'x', onclick:fn}, child, 'text') */
  L.h = function (tag, props) {
    const el = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (sk.startsWith('--')) el.style.setProperty(sk, v[sk]); else el.style[sk] = v[sk]; } }
      else el.setAttribute(k, v === true ? '' : v);
    }
    const kids = Array.prototype.slice.call(arguments, 2).flat(Infinity);
    kids.forEach(c => { if (c == null || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
    return el;
  };
  L.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  L.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  L.rnd = (a, b) => a + Math.random() * (b - a);
  L.pick = arr => arr[Math.floor(Math.random() * arr.length)];
  L.hexId = n => Math.random().toString(16).slice(2, 2 + (n || 5));

  /* Command-line parser for the simulated terminal.
     'docker run -d -p 8080:80 nginx' -> {words:['docker','run','nginx'], flags:{d:true, p:'8080:80'}}
     Boolean long flags: list them in cli.boolFlags; no-*, allow-* are boolean by default. */
  L.parseCmd = function (line, boolFlags) {
    const toks = [];
    let cur = '', q = null;
    for (const ch of line.trim()) {
      if (q) { if (ch === q) q = null; else cur += ch; }
      else if (ch === '"' || ch === "'") q = ch;
      else if (/\s/.test(ch)) { if (cur) { toks.push(cur); cur = ''; } }
      else cur += ch;
    }
    if (cur) toks.push(cur);
    const bools = new Set(['async', 'quiet', 'wait', 'help'].concat(boolFlags || []));
    const isBool = name => bools.has(name) || /^(no-|allow-)/.test(name);
    const words = [], flags = {};
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (t.startsWith('--')) {
        const eq = t.indexOf('=');
        const name = eq > -1 ? t.slice(2, eq) : t.slice(2);
        if (eq > -1) flags[name] = t.slice(eq + 1);
        else if (toks[i + 1] && !toks[i + 1].startsWith('-') && !isBool(name)) flags[name] = toks[++i];
        else flags[name] = true;
      } else if (t.startsWith('-') && t.length === 2) {
        const name = t.slice(1);
        flags[name] = toks[i + 1] && !toks[i + 1].startsWith('-') && !bools.has(name) ? toks[++i] : true;
      } else words.push(t);
    }
    return { words, flags, raw: line.trim() };
  };

  /* Fixed-width table for terminal output. rows: array of arrays. */
  L.table = function (head, rows) {
    const all = [head].concat(rows).map(r => r.map(c => String(c)));
    const w = head.map((_, i) => Math.max.apply(null, all.map(r => (r[i] || '').length)));
    return all.map(r => r.map((c, i) => c.padEnd(w[i])).join('  ').trimEnd()).join('\n');
  };

  /* Copy a diagram spec and change some nodes: L.spec(base, {db: {state: 'down'}}, {nodes: [...extra], links: [...extra]}).
     A node set to null is removed. */
  L.spec = function (base, changes, extra) {
    changes = changes || {}; extra = extra || {};
    const nodes = (base.nodes || []).filter(n => changes[n.id] !== null).map(n => Object.assign({}, n, changes[n.id] || {}));
    const ids = new Set(nodes.map(n => n.id));
    return {
      groups: (base.groups || []).concat(extra.groups || []),
      nodes: nodes.concat(extra.nodes || []),
      links: (base.links || []).filter(l => ids.has(l.a) && ids.has(l.b)).concat(extra.links || [])
    };
  };

  /* Cancellable sleep for tour animations. */
  L.Cancel = function () {
    const t = { dead: false };
    t.sleep = ms => new Promise((res, rej) => setTimeout(() => (t.dead ? rej(L.CANCELLED) : res()), ms));
    t.stop = () => { t.dead = true; };
    return t;
  };
  L.CANCELLED = { cancelled: true };

  /* Compatibility: lab files written for the GCP Service Lab use window.GCPLab. */
  window.GCPLab = L;
})();

/* sim-lab: SVG scene engine.
   A scene is a set of groups (dashed boxes), nodes (cards) and links (lines).
   Call scene.set(spec) as often as you like: nodes are matched by id, so they
   slide to new positions, fade in, or fade out.

   spec = {
     groups: [{id, x, y, w, h, label, tone}],             // x,y = top-left
     nodes:  [{id, kind:'svc'|'actor'|'unit'|'store', x, y, label, sub, abbr, color, state, badge, w, h, dim, hl}],
     links:  [{a, b, label, dash, tone}]                    // a/b = node ids
   }
   kind 'svc' and 'store' draw a hexagon icon with abbr (up to 4 letters); 'unit' is a small
   instance/pod/VM card whose top stripe shows state:
   cold | start | ready | busy | idle | down | evt
*/
(function () {
  'use strict';
  const L = window.SimLab;
  const NS = 'http://www.w3.org/2000/svg';
  const S = (tag, attrs) => { const e = document.createElementNS(NS, tag); if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); return e; };
  const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
  const SIZE = { svc: [184, 60], store: [178, 60], actor: [132, 46], unit: [80, 44] };
  const HEX = r => { const p = []; for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 2; p.push((r * Math.cos(a)).toFixed(1) + ',' + (r * Math.sin(a)).toFixed(1)); } return p.join(' '); };

  L.Scene = function (host, opt) {
    opt = opt || {};
    const W = opt.w || 820, H = opt.h || 430;
    const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, class: 'scene-svg', role: 'img', 'aria-label': opt.label || 'Diagram' });
    const pid = 'grid' + L.hexId(6);
    const defs = S('defs');
    const pat = S('pattern', { id: pid, width: 22, height: 22, patternUnits: 'userSpaceOnUse' });
    pat.append(S('path', { d: 'M22 0H0V22', fill: 'none', class: 'grid-line' }));
    defs.append(pat);
    svg.append(defs, S('rect', { width: W, height: H, class: 'bgrect' }), S('rect', { width: W, height: H, fill: `url(#${pid})` }));
    const gGroups = S('g'), gLinks = S('g'), gPk = S('g'), gNodes = S('g'), gSay = S('g');
    svg.append(gGroups, gLinks, gPk, gNodes, gSay);
    host.append(svg);

    const nodes = new Map(), groups = new Map();
    let speed = 1;

    function buildNode(n) {
      const g = S('g', { class: 'nd' });
      const r = { g, n: {}, box: S('rect', { class: 'box' }), stripe: S('rect', { class: 'stripe' }), hx: S('polygon', { class: 'hx', points: HEX(15) }), hxt: S('text', { class: 'hxt', 'text-anchor': 'middle', 'dominant-baseline': 'central' }), ttl: S('text', { class: 'ttl' }), sub: S('text', { class: 'sub' }), bdg: S('g'), person: S('g') };
      r.bdg.append(S('circle', { class: 'bdg', r: 11 }), S('text', { class: 'bdgt', 'text-anchor': 'middle', 'dominant-baseline': 'central' }));
      r.person.append(S('circle', { cx: 0, cy: -5, r: 5, class: 'hx' }), S('path', { d: 'M-9 10 a9 8 0 0 1 18 0 z', class: 'hx' }));
      g.append(r.box, r.stripe, r.hx, r.hxt, r.person, r.ttl, r.sub, r.bdg);
      g.style.opacity = '0';
      gNodes.append(g);
      setTimeout(() => { g.style.opacity = ''; }, 40);
      return r;
    }

    function paint(r, n) {
      const kind = n.kind || 'svc';
      const sz = SIZE[kind] || SIZE.svc;
      const w = n.w || sz[0], h = n.h || sz[1];
      r.w = w; r.h = h; r.x = n.x; r.y = n.y;
      r.g.style.transform = `translate(${n.x}px, ${n.y}px)`;
      r.g.setAttribute('class', ['nd', kind, n.state ? 's-' + n.state : '', n.hl ? 'hl' : '', n.dim ? 'dim' : '', n.tone ? 't-' + n.tone : ''].join(' ').trim());
      if (n.color) r.g.style.setProperty('--nc', n.color); else r.g.style.removeProperty('--nc');
      const rx = kind === 'actor' ? h / 2 : kind === 'unit' ? 8 : 12;
      Object.entries({ x: -w / 2, y: -h / 2, width: w, height: h, rx }).forEach(([k, v]) => r.box.setAttribute(k, v));
      const isUnit = kind === 'unit';
      r.stripe.style.display = isUnit ? '' : 'none';
      if (isUnit) Object.entries({ x: -w / 2 + 6, y: -h / 2 + 4, width: w - 12, height: 4, rx: 2 }).forEach(([k, v]) => r.stripe.setAttribute(k, v));
      const hasHex = kind === 'svc' || kind === 'store';
      r.hx.style.display = hasHex ? '' : 'none';
      r.hxt.style.display = hasHex ? '' : 'none';
      r.person.style.display = kind === 'actor' ? '' : 'none';
      const iconX = -w / 2 + 24;
      if (hasHex) { r.hx.setAttribute('transform', `translate(${iconX},0)`); r.hxt.setAttribute('x', iconX); r.hxt.setAttribute('y', 0); r.hxt.textContent = (n.abbr || '').slice(0, 4); }
      if (kind === 'actor') r.person.setAttribute('transform', `translate(${-w / 2 + 22},0)`);
      const textX = isUnit ? 0 : -w / 2 + (hasHex ? 46 : 40);
      const anchor = isUnit ? 'middle' : 'start';
      r.ttl.setAttribute('text-anchor', anchor); r.sub.setAttribute('text-anchor', anchor);
      r.ttl.setAttribute('x', textX); r.sub.setAttribute('x', textX);
      const hasSub = !!n.sub;
      r.ttl.setAttribute('y', isUnit ? (hasSub ? 0 : 5) : (hasSub ? -3 : 5));
      r.sub.setAttribute('y', isUnit ? 13 : 13);
      r.ttl.textContent = n.label || '';
      r.sub.textContent = n.sub || '';
      const showB = n.badge != null && n.badge !== '';
      r.bdg.style.display = showB ? '' : 'none';
      if (showB) { r.bdg.setAttribute('transform', `translate(${w / 2 - 4},${-h / 2 + 2})`); r.bdg.lastChild.textContent = n.badge; }
      r.n = n;
    }

    function setGroups(list) {
      const keep = new Set();
      (list || []).forEach(gd => {
        keep.add(gd.id);
        let r = groups.get(gd.id);
        if (!r) { r = { g: S('g', { class: 'grp' }), rect: S('rect', { rx: 14 }), t: S('text') }; r.g.append(r.rect, r.t); gGroups.append(r.g); groups.set(gd.id, r); }
        r.g.setAttribute('class', 'grp' + (gd.tone ? ' ' + gd.tone : ''));
        Object.entries({ x: gd.x, y: gd.y, width: gd.w, height: gd.h }).forEach(([k, v]) => r.rect.setAttribute(k, v));
        r.t.setAttribute('x', gd.x + 12); r.t.setAttribute('y', gd.y + 18); r.t.textContent = gd.label || '';
      });
      for (const [id, r] of groups) if (!keep.has(id)) { r.g.remove(); groups.delete(id); }
    }

    function setLinks(list) {
      gLinks.textContent = '';
      (list || []).forEach(lk => {
        const A = nodes.get(lk.a), B = nodes.get(lk.b);
        if (!A || !B) return;
        gLinks.append(S('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, class: 'lk' + (lk.dash ? ' dash' : '') + (lk.tone ? ' ' + lk.tone : '') }));
        if (lk.label) {
          const mx = (A.x + B.x) / 2 + (lk.dx || 0), my = (A.y + B.y) / 2 + (lk.dy || 0);
          const t = S('text', { x: mx, y: my + 3.5, class: 'lk-l', 'text-anchor': 'middle' });
          t.textContent = lk.label;
          const bw = lk.label.length * 6.4 + 10;
          gLinks.append(S('rect', { x: mx - bw / 2, y: my - 8, width: bw, height: 16, rx: 4, class: 'lk-lb' }), t);
        }
      });
    }

    const api = {
      svg, W, H,
      set(spec) {
        spec = spec || {};
        setGroups(spec.groups);
        const keep = new Set();
        (spec.nodes || []).forEach(n => {
          keep.add(n.id);
          let r = nodes.get(n.id);
          if (!r) { r = buildNode(n); nodes.set(n.id, r); }
          paint(r, n);
        });
        for (const [id, r] of nodes) if (!keep.has(id)) {
          nodes.delete(id);
          r.g.style.opacity = '0';
          setTimeout(() => r.g.remove(), 380);
        }
        setLinks(spec.links);
      },
      node: id => nodes.get(id),
      has: id => nodes.has(id),
      speed(v) { speed = v; },
      /* Move a dot from node a to node b. tone: req | res | evt | bad | warn */
      packet(a, b, o) {
        o = o || {};
        const A = nodes.get(a), B = nodes.get(b);
        if (!A || !B || gPk.childElementCount > 80 || document.hidden) return Promise.resolve();
        const c = S('circle', { r: o.r || 5.5, class: 'pk ' + (o.tone || 'req'), cx: A.x, cy: A.y });
        gPk.append(c);
        const dur = (o.dur || 750) / speed;
        if (reduceMotion()) { c.setAttribute('cx', B.x); c.setAttribute('cy', B.y); return new Promise(res => setTimeout(() => { c.remove(); res(); }, Math.min(dur, 300))); }
        return new Promise(res => {
          const t0 = performance.now();
          const x1 = A.x, y1 = A.y, x2 = B.x, y2 = B.y;
          (function f(t) {
            const k = Math.min(1, (t - t0) / dur);
            const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
            c.setAttribute('cx', x1 + (x2 - x1) * e);
            c.setAttribute('cy', y1 + (y2 - y1) * e);
            if (k < 1 && c.isConnected) requestAnimationFrame(f); else { c.remove(); res(); }
          })(t0);
          setTimeout(() => { if (c.isConnected) { c.remove(); res(); } }, dur + 600); // safety when rAF is paused
        });
      },
      /* Speech bubble above a node for a moment. */
      say(id, text, tone, ms) {
        const r = nodes.get(id);
        if (!r) return;
        const g = S('g', { class: 'say' + (tone ? ' ' + tone : '') });
        const w = String(text).length * 6.7 + 16, y = r.y - r.h / 2 - 24;
        g.append(S('rect', { x: r.x - w / 2, y: y - 11, width: w, height: 22, rx: 6 }));
        const t = S('text', { x: r.x, y: y + 4, 'text-anchor': 'middle' });
        t.textContent = text;
        g.append(t);
        gSay.append(g);
        setTimeout(() => { g.style.opacity = '0'; setTimeout(() => g.remove(), 320); }, (ms || 1600) / speed);
      },
      flash(id) {
        const r = nodes.get(id);
        if (!r) return;
        r.g.classList.remove('flash'); void r.g.getBBox(); r.g.classList.add('flash');
      },
      clearFx() { gPk.textContent = ''; gSay.textContent = ''; },
      destroy() { svg.remove(); nodes.clear(); groups.clear(); }
    };
    return api;
  };

  /* Lay out n units in a grid inside a box. Returns [{x,y}] centres. */
  L.layoutGrid = function (n, box, unitW, unitH, gap) {
    unitW = unitW || 78; unitH = unitH || 42; gap = gap || 10;
    const cols = Math.max(1, Math.floor((box.w - 20 + gap) / (unitW + gap)));
    const out = [];
    for (let i = 0; i < n; i++) {
      const c = i % cols, r = Math.floor(i / cols);
      out.push({ x: box.x + 10 + unitW / 2 + c * (unitW + gap), y: box.y + 34 + unitH / 2 + r * (unitH + gap) });
    }
    return out;
  };
})();

/* sim-lab: the four standard views every topic gets.
   Overview (facts), Tour (step-by-step animation), Simulate (sandbox + terminal), Check (quiz + checklist).
   Every field is optional; a tab appears only when its data exists. */
(function () {
  'use strict';
  const L = window.SimLab, h = L.h;
  L.views = {};

  /* Which tabs a service has, in order. */
  L.tabsOf = function (svc) {
    const t = [];
    if (svc.overview) t.push({ id: 'overview', label: 'Overview' });
    if (svc.tour) t.push({ id: 'tour', label: 'Tour' });
    if (svc.sim) t.push({ id: 'sim', label: 'Simulate' });
    (svc.extraTabs || []).forEach(x => t.push(x));
    if (svc.quiz || svc.learn) t.push({ id: 'check', label: 'Check' });
    return t;
  };

  const metricEl = m => h('div', { class: 'metric' + (m[2] ? ' ' + m[2] : '') }, h('span', { class: 'lbl' }, m[0]), h('b', null, m[1]));
  const legendEl = items => h('div', { class: 'legend' }, (items || [['req', 'request'], ['res', 'response'], ['evt', 'event'], ['bad', 'error']]).map(([t, l]) => h('span', null, h('i', { style: { background: `var(--${({ req: 'accent', res: 'ok', evt: 'evt', bad: 'bad', warn: 'warn' })[t] || 'accent'})` } }), l)));

  /* ---------- Overview ---------- */
  const list = (items, cls) => h('ul', { class: 'tick' + (cls ? ' ' + cls : '') }, items.map(x => h('li', { html: x })));
  L.views.overview = function (el, svc) {
    const o = svc.overview;
    L.mark(svc.id, 'overview');
    const hero = [
      h('div', { class: 'card' }, h('span', { class: 'lbl' }, 'What it is'), h('p', { class: 'what', html: o.what || '' }), o.analogy && h('p', { class: 'analogy', html: '<b>Think of it as:</b> ' + o.analogy })),
      (o.signals && o.signals.length) ? h('div', { class: 'card' }, h('span', { class: 'lbl' }, o.signalsTitle || 'Clues that point here'), h('div', { style: { height: '8px' } }), list(o.signals, 'sig')) : null
    ].filter(Boolean);
    const pair = [
      o.use && h('div', { class: 'card' }, h('h3', null, 'Use it when'), list(o.use)),
      o.avoid && h('div', { class: 'card' }, h('h3', null, 'Pick something else when'), list(o.avoid, 'no'))
    ].filter(Boolean);
    const nums = (o.numbers || o.pricing) ? h('div', { class: 'card' }, h('h3', null, 'Numbers and limits'),
      o.numbers && h('div', { class: 'tbl-wrap' }, h('table', { class: 'kv' }, h('tbody', null, o.numbers.map(([k, v]) => h('tr', null, h('td', { html: k }), h('td', { html: v })))))),
      o.pricing && h('p', { style: { marginTop: '10px', fontSize: '.88rem' }, html: '<b>Cost:</b> ' + o.pricing })) : null;
    const rel = (svc.related && svc.related.length) ? h('div', { class: 'card' }, h('h3', null, 'Works with'),

  /* ---------- Flow: a short way to write tour animations ----------

       { say: 'server', text: 'thinking', tone: 'warn' },

  const SAY_TONE = { res: 'ok', bad: 'bad', evt: 'evt', warn: 'warn' };

      else if (it.say) S.say(it.say, it.text, it.tone, it.ms);
      else if (it.set) S.set(it.set);
      else if (it.flash) S.flash(it.flash);
      else if (it.metrics && setMetrics) setMetrics(it.metrics);
      if (Array.isArray(it) || it.say) await t.sleep(it.gap || 250);

  };

  /* ---------- Tour ---------- */
  L.views.tour = function (el, svc, ctx) {
    const T = svc.tour, steps = T.steps;
    const seenKey = 'tour_' + svc.id;
    const seen = new Set(L.store.get(seenKey, []));

    el.append(h('div', { class: 'stage-grid' }, stage, h('div', { class: 'side' }, panel, learn, h('div', { style: { display: 'flex', gap: '8px' } }, replay))));

    const S = L.Scene(sceneBox, { w: T.w, h: T.h, label: svc.name + ' tour diagram' });

    function drawStrip() {

    const onKey = e => {

  /* ---------- Simulate ---------- */
  L.views.sim = function (el, svc) {

        h('div', { class: 'term-box' }, h('div', { class: 'term-head' }, h('i'), h('i'), h('i'), h('span', null, (D.cli.title || 'Terminal') + ' (simulated)')), out, h('div', { class: 'term-in' }, h('span', null, '$'), inp)),

    let lastDraw = 0;
    function render(force) {

      const m = Math.floor(simT / 60), s = Math.floor(simT % 60);

  /* ---------- Check ---------- */

<script>
(function () {
  'use strict';
  const L = window.SimLab;

  /* ---------- Tour diagram ---------- */
  const LINKS = [
    { a: 'client', b: 'proxy', label: 'TCP' },
    { a: 'proxy', b: 'server', label: 'TCP' }
  ];
  const base = {
    groups: [],
    nodes: [
      { id: 'client', kind: 'actor', x: 90, y: 215, label: 'Browser', sub: 'new WebSocket', w: 150 },
      { id: 'proxy', kind: 'svc', x: 340, y: 215, label: 'Reverse proxy', sub: 'nginx: idle 60 s', abbr: 'PX' },
      { id: 'server', kind: 'svc', x: 610, y: 215, label: 'App server', sub: 'WebSocket endpoint', abbr: 'WS' },
      { id: 'conn', kind: 'unit', x: 340, y: 340, label: 'socket', sub: 'CLOSED', state: 'cold' }
    ],
    links: LINKS
  };
  const sock = (state, sub, more) => L.spec(base, Object.assign({ conn: { state, sub } }, more || {}));
  const noSock = L.spec(base, { conn: null });
  const SOCK_CONNECTING = sock('start', 'CONNECTING');
  const SOCK_OPEN = sock('ready', 'OPEN');
  const cut = (spec) => Object.assign({}, spec, {
    links: [{ a: 'client', b: 'proxy', label: 'cable cut', dash: true, tone: 'bad' }, { a: 'proxy', b: 'server', label: 'TCP' }]
  });

  /* Reconnect step: six browser tabs instead of one browser */
  const TABS = ['t1', 't2', 't3', 't4', 't5', 't6'];
  const tabsSpec = (state, serverState) => {
    const nodes = TABS.map((id, i) => ({ id, kind: 'unit', x: 90, y: 60 + i * 62, label: 'tab ' + (i + 1), sub: state === 'ready' ? 'OPEN' : state === 'down' ? 'CLOSED' : 'retry', state }));
    return L.spec(base, { client: null, conn: null, server: { state: serverState } }, {
      nodes,
      links: TABS.map(id => ({ a: id, b: 'proxy' }))
    });
  };

  /* ---------- Simulator model ---------- */
  const mkConn = (i) => ({ id: 'c' + (i + 1), n: i + 1, state: 'start', t: 0, idle: 0, hbIn: 0, retryIn: 0, tries: 0, code: '', busy: 0 });
  const resize = (s) => {
    while (s.conns.length < s.clients) s.conns.push(mkConn(s.conns.length));
    s.conns.length = s.clients;
  };
  const retryDelay = (s, c) => {
    if (s.reconnect === 'none') return Infinity;
    if (s.reconnect === 'now') return 0.2;
    return Math.random() * Math.min(30, 5 * Math.pow(2, c.tries)); // first try: random 0-5 s, then doubles (cap 30 s)
  };
  const goDown = (s, c, code) => {
    c.state = 'down'; c.code = code; c.idle = 0; c.busy = 0;
    c.retryIn = retryDelay(s, c); c.tries++;
  };
  const startHandshake = (s, c, now) => {
    c.state = 'start'; c.t = 0; c.code = '';
    s.hs.push(now);
  };
  const serverDown = (s, now) => now < s.serverUpAt;
  const netDown = (s, now) => now < s.netUpAt;

  const restartServer = (s, api) => {
    const now = api.now();
    let n = 0;
    s.conns.forEach(c => {
      if (c.state === 'open') {
        if (n < 3) api.packet('server', c.id, 'bad');
        goDown(s, c, '1001'); n++;

      tick: (s, dt, api) => {

        const srvDown = serverDown(s, now), net = netDown(s, now);

              s.stats.msgs++; s.msgT.push(now); c.busy = 0.5; pkt(c.id, 'server', 'req');

        { type: 'heading', label: 'Keep-alive and proxy' },
        { type: 'range', id: 'heartbeat', label: 'Server Ping interval', min: 0, max: 60, step: 5, fmt: v => v ? v + ' s' : 'off', get: s => s.heartbeat,
          set: (s, v) => { s.heartbeat = v; s.conns.forEach(c => { c.hbIn = Math.min(c.hbIn, v); }); },
          help: 'A Ping from the server counts as data, so it resets the proxy timer.' },
        { type: 'range', id: 'proxyIdle', label: 'Proxy idle timeout', min: 10, max: 120, step: 5, fmt: v => v + ' s', get: s => s.proxyIdle,
          set: (s, v) => { s.proxyIdle = v; }, help: 'nginx default: 60 s (proxy_read_timeout). Other load balancers differ.' },
        { type: 'toggle', id: 'upgradeOk', label: 'Proxy forwards Upgrade headers', get: s => s.upgradeOk,
          set: (s, v, api) => { s.upgradeOk = v; api.log(v ? 'Proxy now sets Upgrade and Connection headers.' : 'Proxy config lost the Upgrade/Connection headers. New handshakes will fail.', v ? 'ok' : 'bad'); },
          help: 'Without proxy_set_header Upgrade/Connection, nginx sends a plain GET.' },
        { type: 'actions', items: [
          { label: 'Restart server', tone: 'bad', run: (s, api) => restartServer(s, api) },
          { label: 'Pull the cable (8 s)', tone: 'bad', run: (s, api) => dropNetwork(s, api) },
          { label: 'Close all cleanly', run: (s, api) => closeAll(s, api) },
          { label: 'Open all again', run: (s, api) => openAll(s, api) }
        ] }
      ],
      scenarios: [
        { title: 'Quiet app, no heartbeat', desc: 'Pings off, few messages, proxy timeout shortened to 20 s (nginx default is 60 s) so you don\'t wait. Watch connections die and reconnect.',
          run: (s, api) => { s.heartbeat = 0; s.proxyIdle = 20; s.rate = 1; s.reconnect = 'backoff'; s.upgradeOk = true; fresh(s, api); api.log('Scenario: heartbeat off behind a 20 s proxy.', 'warn'); } },
        { title: 'Same app with 10 s Pings', desc: 'Server Pings every 10 s, under the 20 s proxy timeout. Idle kills stop.',
          run: (s, api) => { s.heartbeat = 10; s.proxyIdle = 20; s.rate = 1; s.reconnect = 'backoff'; s.upgradeOk = true; fresh(s, api); api.log('Scenario: Ping every 10 s behind a 20 s proxy.', 'ok'); } },
        { title: 'Restart + instant reconnect', desc: '16 tabs reconnect every 0.2 s while the server restarts. Watch peak handshakes/s.',
          run: (s, api) => { s.clients = 16; s.heartbeat = 25; s.proxyIdle = 60; s.rate = 2; s.reconnect = 'now'; s.upgradeOk = true; fresh(s, api); allOpen(s, () => 25); restartServer(s, api); } },
        { title: 'Restart + random delay and backoff', desc: 'The same restart, but each tab waits a random 0–5 s first. Handshakes spread out.',
          run: (s, api) => { s.clients = 16; s.heartbeat = 25; s.proxyIdle = 60; s.rate = 2; s.reconnect = 'backoff'; s.upgradeOk = true; fresh(s, api); allOpen(s, () => 25); restartServer(s, api); } },
        { title: 'Cable pulled', desc: 'The network vanishes for 8 s. Connections still say OPEN until a Ping or a write fails. Compare with "Close all cleanly".',
          run: (s, api) => { s.heartbeat = 5; s.proxyIdle = 60; s.rate = 4; s.reconnect = 'backoff'; s.upgradeOk = true; fresh(s, api); allOpen(s, () => 2 + Math.random() * 5); dropNetwork(s, api); } }
      ],
      onStart: (s, api) => { api.log('8 tabs open WebSockets through the proxy. Try the scenarios, or pull the cable.', ''); }
    },

    quiz: [
      { q: 'A notification service runs behind nginx with default settings. Browsers send a heartbeat message every 20 s, but connections still drop after about 60 s when no notifications arrive. What fixes it?',
        o: ['Send the client heartbeat more often', 'Have the server send Ping frames (or raise proxy_read_timeout)', 'Switch from text to binary frames', 'Raise the maximum frame size'],
        a: 1, y: 'nginx closes the connection if the <b>proxied server</b> sends nothing for 60 s. Client traffic does not reset that timer; server Pings do.' },
      { q: 'Right after you put nginx in front of your app, every WebSocket fails. The server logs show an ordinary GET with no Upgrade header. What is wrong?',
        o: ['The client forgot Sec-WebSocket-Version', 'The server must reply 200 instead of 101', 'The client frames are not masked', 'nginx is not forwarding the hop-by-hop Upgrade and Connection headers'],
        a: 3, y: 'Upgrade and Connection are hop-by-hop. nginx only passes them on if you set them with <code>proxy_set_header</code>.' },
      { q: 'After a deploy, 50,000 clients reconnect in the same second and the server falls over again. What does RFC 6455 recommend?',
        o: ['Wait a random time before the first retry (0–5 s suggested), then back off further', 'Retry immediately so clients miss as little as possible', 'Keep the old connection object and keep sending until it works', 'Send Close 1000 before reconnecting'],
        a: 0, y: 'The spec says clients SHOULD delay the first reconnect by a random amount and use backoff (for example truncated binary exponential) after that.' },
      { q: 'Your onclose handler logs code 1006. What happened?',
        o: ['The server sent a Close frame with code 1006', 'The page navigated away normally', 'The connection ended without any Close frame, e.g. the network or a proxy cut it', 'The message was too big'],
        a: 2, y: '1006 is never sent on the wire. It is reported locally when the connection closed without a Close frame.' },
      { q: 'Your hand-written test client connects fine, but the server closes the connection with 1002 as soon as the client sends its first message. Most likely cause?',
        o: ['The server should mask its frames', 'The client is not masking its frames', 'The client sent a Ping', 'The handshake used Version 13'],
        a: 1, y: 'Clients MUST mask every frame. A server that receives an unmasked frame must close the connection and may use 1002 (protocol error).' },
      { q: 'A server answers the upgrade request with 200 OK and all the right WebSocket headers. Is the connection open?',
        o: ['Yes, any 2xx status works', 'Yes, if Sec-WebSocket-Accept is correct', 'Only if the client sends a Ping first', 'No, only 101 Switching Protocols completes the handshake'],
        a: 3, y: 'Any status other than 101 means the WebSocket handshake has not completed.' },
      { q: 'A laptop loses Wi-Fi for 30 s. The app is quiet and has no heartbeat. Why does the server still list the connection as OPEN?',
        o: ['No Close frame was sent and nothing tried to write, so nothing has failed yet', 'The browser sent Close 1001 and the server ignored it', 'The proxy keeps the connection alive for the client', 'WebSocket connections cannot break once open'],
        a: 0, y: 'A dead link is only noticed when a write fails or a Ping gets no Pong. Heartbeats exist to find these quickly.' }
    ],

    learn: [
      'Can you name the headers in the opening handshake and the status that confirms it?',
      'Can you explain why a quiet connection behind a proxy dies, and two ways to fix it?',
      'Can you explain the difference between close code 1000 and 1006?',
      'Can you explain why clients should wait a random time before reconnecting?'
    ],

    related: [
      { name: 'HTTP/1.1', abbr: 'HTTP', how: 'The handshake is an HTTP GET with an Upgrade header.', color: 'var(--c-blue)' },
      { name: 'TCP', abbr: 'TCP', how: 'Every frame travels on the one long-lived TCP connection.', color: 'var(--c-blue)' },
      { name: 'TLS', abbr: 'TLS', how: '<code>wss://</code> runs WebSocket over TLS.', color: 'var(--c-blue)' }
    ],

    sources: [
      { title: 'RFC 6455: The WebSocket Protocol', url: 'https://www.rfc-editor.org/rfc/rfc6455', note: 'Handshake, frames, opcodes, masking, Ping/Pong, close codes, reconnect backoff (§7.2.3)' },
      { title: 'MDN: WebSocket API', url: 'https://developer.mozilla.org/en-US/docs/Web/API/WebSocket', note: 'Browser API: events, send(), close(), bufferedAmount; no backpressure' },
      { title: 'nginx: WebSocket proxying', url: 'https://nginx.org/en/docs/http/websocket.html', note: 'Upgrade/Connection headers, 60 s default idle close, Pings to keep alive' }
    ],

    simplified: 'One frame per message, no TCP or TLS details; a dead network is noticed on the next write or Ping instead of after TCP timeouts; scenarios shorten the 60 s nginx timeout so you don\'t wait.'
  });
})();

</script>
<script>
/* sim-lab: page shell for one topic. Header, theme toggle, tabs, sources footer. Runs last. */
(function () {
  'use strict';
  const L = window.SimLab, h = L.h;
  const app = document.getElementById('app');
  const t = L.current;
  if (!t) { app.textContent = 'No topic loaded. The topic file must call SimLab.topic({...}).'; return; }

  /* Theme: auto (follows the system) -> light -> dark. Remembered per browser. */
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme');
  const THEMES = ['auto', 'light', 'dark'];
  let theme = 'auto';
  try { theme = localStorage.getItem('simlab_theme') || 'auto'; } catch (e) { /* ignore */ }
  function applyTheme() {
    if (theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', theme);
    themeBtn.textContent = { auto: '◐ Auto', light: '☀ Light', dark: '☾ Dark' }[theme];
    themeBtn.setAttribute('aria-label', 'Colour theme: ' + theme + '. Click to change.');
  }
  themeBtn.addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('simlab_theme', theme); } catch (e) { /* ignore */ }
    applyTheme();
  });
  applyTheme();

  document.title = t.name + ' · how it works';
  document.getElementById('brand-name').textContent = t.name;
  const topProg = document.getElementById('top-prog');

  const tabs = L.tabsOf(t);
  let cur = L.store.get('tab', tabs[0].id);
  if (!tabs.some(x => x.id === cur)) cur = tabs[0].id;
  const tabBar = h('div', { class: 'tabs', role: 'tablist' });
  const body = h('div', { role: 'tabpanel' });
  let viewCleanup = null;
  const ctx = { switchTab };

  function drawProgress() {
    const p = L.prog(t.id);
    const done = tabs.filter(x => p[x.id]).length;
    topProg.textContent = '';
    topProg.append(h('span', null, done + ' of ' + tabs.length + ' done'), h('span', { class: 'bar' }, h('i', { style: { width: (100 * done / tabs.length) + '%' } })));
  }
  function drawTabs() {
    tabBar.textContent = '';
    const p = L.prog(t.id);
    tabs.forEach(x => tabBar.append(h('button', { role: 'tab', 'aria-selected': x.id === cur ? 'true' : 'false', onclick: () => switchTab(x.id) }, h('span', { class: 'ok' + (p[x.id] ? ' d' : '') }), x.label)));
  }
  function switchTab(id) {
    cur = id;
    L.store.set('tab', id);
    if (viewCleanup) { viewCleanup(); viewCleanup = null; }
    body.textContent = '';
    const tab = tabs.find(x => x.id === id);
    const fn = tab.render || L.views[id];
    viewCleanup = fn(body, t, ctx) || null;
    drawTabs();
    window.scrollTo({ top: 0 });
  }
  document.addEventListener('simlab:progress', () => { drawTabs(); drawProgress(); });

  const sources = t.sources || [];
  const foot = h('footer', { class: 'foot' },
    sources.length > 0 && h('div', { class: 'sources' }, h('span', { class: 'lbl' }, 'Sources'),
      h('ol', null, sources.map(s => h('li', null, h('a', { href: s.url || s[1], target: '_blank', rel: 'noopener' }, s.title || s[0]), (s.note || s[2]) && h('span', null, ' · ' + (s.note || s[2])))))),
    h('div', { class: 'foot-row' },
      h('span', null, t.simplified || 'A teaching model, simplified on purpose: timing, scale and numbers are approximate. Check the sources for exact behaviour.'),
      h('span', null, 'Made with sim-lab · progress is saved in this browser only.')));

  app.append(
    h('div', { class: 'svc-head' },
      h('span', { class: 'hex lg', style: { '--c': t.color || 'var(--accent)' } }, (t.abbr || t.name).slice(0, 4)),
      h('div', { class: 't' }, h('h1', null, t.name), t.tagline && h('p', { html: t.tagline }),
        t.chips && h('div', { class: 'chips' }, t.chips.map(c => h('span', { class: 'chip ' + (c[1] || '') }, c[0]))))),
    tabBar, body, foot);
  switchTab(cur);
  drawProgress();
})();

</script>
</html>
